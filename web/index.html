<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GoEngine — demo1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    canvas { display: block; image-rendering: pixelated; }
    #loading { color: #ccc; font-family: monospace; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
      .then(result => {
        document.getElementById("loading").style.display = "none";
        go.run(result.instance);
      })
      .catch(err => {
        document.getElementById("loading").textContent = "Failed to load: " + err;
      });
  </script>
</body>
</html>
