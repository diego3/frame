# GoEngine config (YAML)
# Omit or leave empty to use defaults.

window:
  width: 800
  height: 600
  title: "GoEngine"
  resizable: true
  fullscreen: false

# Logical size for rendering (game coordinates); scaled to fit window.
layout:
  width: 800
  height: 600

# Asset paths (optional; used by scenes).
assets:
  font_path: "assets/ShadeBlue-2OozX.ttf"
  font_size: 24
  click_sound: "assets/840321__robo9418__wooden-short-click.wav"
  scene_path: "scenes/main_menu.yaml"  # data-driven scene (objects + components)

# Physics (used when scene uses physics; e.g. Box2D).
physics:
  gravity_x: 0      # game units/s² (usually 0)
  gravity_y: 800    # game units/s² (positive = down)
  pixel_scale: 64  # game units per meter

# Camera: follows the named GameObject's center, clamped to the level bounds (layout.level_width/
# level_height below; omit or leave at layout size for no scroll room). demo1's level is exactly
# screen-sized, so this validates the camera math without changing what's on screen.
camera:
  follow: knight

# Input: action name -> key name(s). Keys can be a string or list (e.g. [ShiftLeft, ShiftRight]).
# Omit to use engine defaults. Key names: A-Z, 0-9, Space, ShiftLeft, ShiftRight, Left, Right, Up, Down, F1-F12, etc.
input:
  debug_overlay: F3
  move_left: A
  move_right: D
  move_up: W
  move_down: S
  dash: [ShiftLeft, ShiftRight]
  attack: J
  attack2: K

# Script events: when an input action is pressed, emit ScriptEmitted with this name so Lua on_event(name, payload) receives it.
script_events:
  dash: "DashRequested"
  attack: "AttackRequested"
  attack2: "Attack2Requested"

# Scenes: scene id -> scene type (looked up in view/scene.Factories). initial_scene is the id loaded first.
# Omit both to fall back to the engine default (a single "main_menu" scene).
scenes:
  main_menu: main_menu
initial_scene: main_menu
