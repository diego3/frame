# GoEngine config — Metal Slug demo, Python scripting variant.
# Identical to config.yaml but uses the Python script engine and the Python scene/script.
# Run with: go run . games/metalslug_demo/config_python.yaml

window:
  width: 960
  height: 540
  title: "Metal Slug Demo (Python scripts)"
  resizable: true
  fullscreen: false

layout:
  width: 960
  height: 540
  level_width: 2400
  level_height: 540

assets:
  font_path: "assets/ShadeBlue-2OozX.ttf"
  font_size: 24
  click_sound: "assets/840321__robo9418__wooden-short-click.wav"
  scene_path: "scenes/level1_python.yaml"

physics:
  gravity_x: 0
  gravity_y: 800
  pixel_scale: 64

camera:
  follow: player

script_events:
  attack: "AttackRequested"

scenes:
  level1: main_menu
initial_scene: level1

# Select the scripting backend. "python" uses gpython (pure-Go Python 3.4).
script_engine: "python"
