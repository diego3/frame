# Level 1 — data-driven scene (objects + components), same pattern as
# games/demo1/scenes/main_menu.yaml. Placeholder Block/Ball shapes stand in for real sprites
# (see docs/game_concept_metal_slug_demo.md "Open questions" — art comes later, doesn't block mechanics).
#
# Level is 2400x540 game units (layout.level_width/level_height in config.yaml), 2.5x the 960x540
# viewport, so camera-follow (step 1) has room to scroll. Player run + shoot (step 3) is wired up;
# shooting spawns a projectile GameObject by cloning "projectile_prototype" below (Prototype
# pattern — see view/scene/mainmenu.go's spawnProjectile and object.GameObject.Clone). Projectile
# movement + off-level deactivation (step 4), and enemy walk + AABB hit-test/HP/death (step 5), are
# both wired up — this scene is now the full build-plan MVP.

objects:
  # Background: two parallax layers (see object.ParallaxLayer / scene.WorldScene.drawParallaxLayers)
  # replacing the old flat-color bg_stripe_0..11 placeholder. Source art is
  # SideviewSciFi's sci-fi-environment-background-files (a real, exported PNG pair meant for exactly
  # this: sky.png is the opaque backdrop, back.png is the same canvas with a transparent sky and an
  # opaque mountain/ground silhouette in the lower ~40%, so drawing sky then back at the identical
  # position/scale composites into one background -- see the alpha check that confirmed this before
  # writing these entries). Both are scaled 540/176 (level_height / source height, uniform on both
  # axes to keep the pixel art undistorted) so the art fully covers the level's height; drawn scaled
  # width (288 * that factor =~ 884px) is narrower than the 960px viewport, so both set repeat:
  # true to tile and avoid a gap on the right as the camera scrolls. sky is listed first (drawn
  # first, so back's transparent sky-region shows it through) and given a lower scroll_factor (0,
  # fixed to the camera -- reads as infinitely distant) than back (0.25 -- drifts slowly against
  # gameplay, which itself scrolls at the implicit 1.0 every other object gets via the world buffer)
  # for a two-layer depth effect as the player crosses the level's 2400-wide scroll range.
  - name: bg_sky
    components:
      - type: transform
        x: 0
        y: 0
        scale_x: 3.0682
        scale_y: 3.0682
      - type: parallax_layer
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/sky.png"
        scroll_factor: 0
        repeat: true
  - name: bg_mountains
    components:
      - type: transform
        x: 0
        y: 0
        scale_x: 3.0682
        scale_y: 3.0682
      - type: parallax_layer
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/back.png"
        scroll_factor: 0.25
        repeat: true

  # Prototype (not a real object): "prototype: true" means this is never run or drawn (see
  # object.GameObject.IsPrototype) — it only exists to be cloned by spawnProjectile. Its transform
  # (position) is overwritten on every clone; block width/height double as the projectile's own
  # half-size for centering it on spawn (see MainMenu.spawnProjectile), so they're real, not
  # placeholders. speed/spawn_clearance/despawn_margin/damage are template config, read as-is by
  # every clone -- tune a projectile's whole feel (range, how far it spawns clear of the shooter's
  # own body regardless of that shooter's size, how far past the level edge it survives) here,
  # with no Go changes needed.
  - name: projectile_prototype
    prototype: true
    components:
      - type: transform
      - type: block
        width: 8
        height: 8
        color_r: 220
        color_g: 220
        color_b: 80
      - type: projectile
        damage: 1
        speed: 360
        spawn_clearance: 5
        despawn_margin: 20

  # Invisible entity (no block/ball/physics_body -- nothing to draw or collide) that hosts this
  # demo's game-rule script. Anything that decides *when*/*what*/*with what parameters* to spawn
  # (e.g. the periodic falling-sphere hazard below) is a game rule, not generic engine behavior,
  # so it lives in Python here rather than in view/scene/mainmenu.go, which is a reusable scene
  # type shared by other games/scenes.
  - name: game_manager
    components:
      - type: transform
      - type: script
        path: "scripts/python/game_manager.py"
  - name: player
    components:
      - type: transform
        x: 100
        y: 380
        # 45x45 source sprite frames scaled up ~1.78x (80/45) so the character's visual height
        # roughly matches the 50x80 physics body below -- kept as a Transform scale (not a sprite
        # resize) so the physics body/ground-contact/jump tuning done earlier this session (see
        # platform_1..4's height comments) needs no changes. set_facing(dir_x) (see
        # player_controller.py) only flips this value's sign, never its magnitude.
        scale_x: 1.7778
        scale_y: 1.7778
      # Real art (vacaroxa's "generic run 'n' gun" pack) replacing the placeholder Block. Frames
      # were sliced out of Player/SpriteSheet_player.png (8x7 grid, 45x45/frame) into per-
      # animation strips (Player/anim_*.png) since object.Spritesheet has no way to window a
      # sub-region of a shared master sheet -- see games/metalslug_demo/assets/.../Player for the
      # slicing. Animator below shows exactly one of these per frame (see Manager.Draw).
      - type: spritesheet
        name: idle
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Player/anim_idle.png"
        frame_width: 45
        frame_height: 45
        cols: 6
        rows: 1
        fps: 6
      - type: spritesheet
        name: run
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Player/anim_run.png"
        frame_width: 45
        frame_height: 45
        cols: 6
        rows: 1
        fps: 12
      - type: spritesheet
        name: jump
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Player/anim_jump.png"
        frame_width: 45
        frame_height: 45
        cols: 2
        rows: 1
        fps: 8
        loop: false
      - type: animator
        current: idle
      # width/height/offset derived from the sprite's actual opaque pixel bounding box (union
      # across idle/run/jump frames, in the scaled ~80x80 on-screen frame: x~[25,64], y~[16,80]),
      # not the old 50x80 placeholder-Block guess -- the debug overlay showed a hitbox visibly
      # larger than the character. The bottom edge (offset_y + height = 80) is kept identical to
      # before on purpose: that's the feet/ground-contact line the platform_1..4 height comments
      # and jump-impulse tuning earlier this session were calibrated against, so this only trims
      # the box inward (narrower, less headroom above), never moves where the feet touch ground.
      - type: physics_body
        body_type: dynamic
        width: 35
        height: 60
        offset_x: 27
        offset_y: 20
        friction: 0
        fixed_rotation: true
      - type: intent_buffer
      - type: script
        path: "scripts/python/player_controller.py"
  - name: enemy_1
    components:
      - type: transform
        x: 1900
        y: 380
        scale_x: -1 # enemy_walk.py always moves left; -1 points the facing marker that way too
      - type: block
        width: 50
        height: 80
        color_r: 160
        color_g: 60
        color_b: 60
        facing_marker: true
      - type: physics_body
        body_type: kinematic
        width: 50
        height: 80
        mass: 10
      - type: script
        path: "scripts/python/enemy_walk.py"
      - type: enemy
        hp: 1
  # Ground/crates below all swap their flat-color Block for a Sprite cropped from
  # sci-fi-environment-tileset.png (same sheet the bg_mountains parallax layer's canyon comes from,
  # for a consistent palette) -- see pieces/*.png next to sky.png/back.png, cropped with PIL since
  # the tileset's pieces are irregular, not a uniform grid object.Spritesheet could window on its
  # own (same reason the player's anim_*.png frames were pre-sliced -- see the player transform's
  # comment above). physics_body keeps each object's exact prior width/height explicitly: with the
  # block component gone, PhysicsSystem.InitFromWorld has no sibling Block to fall back to for
  # sizing (see its "prefer Block dimensions when present" comment) and would otherwise default to
  # 64x64, silently shrinking hitboxes -- these values are unchanged from the old Block entries on
  # purpose, so collision behavior (and the platform-jump-height comments below) has zero regression.
  - name: ground
    components:
      - type: transform
        x: 0
        y: 460
        # ground_tile.png is 32x32; 2.5x scale renders it at 80x80, matching physics_body's height
        # exactly. repeat_width covers the full 2400-wide level (30 tiles, no partial tile at the
        # seam since 2400 is an exact multiple of the scaled 80px tile).
        scale_x: 2.5
        scale_y: 2.5
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/ground_tile.png"
        repeat_width: 2400
      - type: physics_body
        body_type: static
        width: 2400
        height: 80
  - name: crate_1
    components:
      - type: transform
        x: 700
        y: 380
        # crate_block.png is 32x32; non-uniform scale stretches it to exactly the crate's own
        # footprint (60x80) -- a mild aspect distortion, traded for not needing a second tiling axis
        # just for two static props (see crate_2/crate_3 below for the same trade).
        scale_x: 1.875
        scale_y: 2.5
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/crate_block.png"
      - type: physics_body
        body_type: static
        width: 60
        height: 80
  - name: crate_2
    components:
      - type: transform
        x: 1400
        y: 400
        scale_x: 2.5
        scale_y: 1.875
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/crate_block.png"
      - type: physics_body
        body_type: static
        width: 80
        height: 60
  - name: crate_3
    components:
      - type: transform
        x: 2050
        y: 80
        # crate_3 is a tall thin pillar (60x380), not a box like crate_1/2 -- pillar_column.png
        # (16x176, an alternating tan/dark-red canyon-wall column strip from the same tileset) fits
        # that silhouette far better than stretching the square crate_block.png would.
        scale_x: 3.75
        scale_y: 2.1591
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/pillar_column.png"
      - type: physics_body
        body_type: static
        width: 60
        height: 380

  # Platforms — floating static ledges at increasing height/difficulty, for exercising jump arcs
  # beyond the crates above (a straight side-on wall vs. a ledge you jump ONTO are different
  # tests). Height reached by a jump is measured from the ground SURFACE (y=460, where the
  # player's feet rest), not from the player's own resting Transform.Y (380, which is offset by
  # its own height) -- a jump peaks with the player's feet roughly 90-100 units above y=460, i.e.
  # a reachable platform's top (its own Transform.Y, since platforms have no height offset here)
  # needs to be no lower than ~y=365. platform_1..4 step from "trivial" to "right at the limit".
  # platform_1..4 swap Block for a Sprite tiling platform_cap.png (32x20, a rounded rock-top ledge
  # cropped from the same canyon tileset as ground/crates above) via repeat_width -- no scale needed
  # since the piece's own 20px height already matches the platforms' original Block height exactly.
  # Same "physics_body needs explicit width/height now that there's no sibling Block to size from"
  # note as ground/crates above applies to all four.
  - name: platform_1
    components:
      - type: transform
        x: 300
        y: 425 # feet rise 460-425=35 units -- trivial hop
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/platform_cap.png"
        repeat_width: 120
      - type: physics_body
        body_type: static
        width: 120
        height: 20

  # Stationary "bomber" enemy standing on platform_1, lobbing sphere_prototype bombs at the player
  # in a parabolic arc -- see enemy_bomber.py for the aim/throw rule (Python, per this project's
  # scripting convention) and MainMenu.spawnEntity's "vel_x"/"vel_y" payload keys for the generic
  # engine mechanism that actually launches the clone. Reuses the exact same bomb/explosion chain
  # already wired up for the falling-sphere hazard (sphere_timer.py/explosion_effect.py) -- only
  # the throw itself (who fires, when, aimed where) is new.
  # Sprite: first 5 frames of Enemies/RPGmob.png (44x44/frame; frames 5-9 are a death animation,
  # not used here), pre-sliced into anim_rpg_attack.png the same way the player's frames were
  # sliced out of a shared master sheet (object.Spritesheet can't window a sub-region on its own).
  # "idle" reuses that same 5-frame strip but pinned to frame_index 0 with fps: 0 (static, no
  # auto-advance -- see object.Spritesheet.Update) so it's just the resting aim pose; "attack" plays
  # the full 5-frame strip once (loop: false) -- enemy_bomber.py switches to it only for the
  # duration of a shot (see self.play_animation/self.animation_finished there), same
  # idle/run/jump-style animator pattern as the player.
  # scale_x/y 1.6 (44 -> ~70px) roughly matches the player/enemy_1 character heights on screen.
  # scale_x's sign is flipped at runtime by enemy_bomber.py (self.set_facing) to face the player;
  # positive (as set here) is this sprite's natural facing direction, matching set_facing's
  # preserve-magnitude/flip-sign convention (see player_controller.py).
  # physics_body has no "block" sibling, so it's sized/offset to approximate the sprite's opaque
  # footprint for aabb() (view/scene/mainmenu.go), the same convention as the player's hitbox.
  - name: enemy_bomber
    components:
      - type: transform
        x: 325
        y: 355
        scale_x: 1.6
        scale_y: 1.6
      - type: spritesheet
        name: idle
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Enemies/anim_rpg_attack.png"
        frame_width: 44
        frame_height: 44
        cols: 5
        rows: 1
        frame_index: 0
        fps: 0
      - type: spritesheet
        name: attack
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Enemies/anim_rpg_attack.png"
        frame_width: 44
        frame_height: 44
        cols: 5
        rows: 1
        fps: 10
        loop: false
      - type: animator
        current: idle
      - type: physics_body
        body_type: static
        width: 45
        height: 55
        offset_x: 13
        offset_y: 15
      - type: enemy
        hp: 1
      - type: script
        path: "scripts/python/enemy_bomber.py"
  - name: platform_2
    components:
      - type: transform
        x: 950
        y: 400 # feet rise 60 units -- easy, needs an actual jump though
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/platform_cap.png"
        repeat_width: 140
      - type: physics_body
        body_type: static
        width: 140
        height: 20
  - name: platform_3
    components:
      - type: transform
        x: 1300
        y: 380 # feet rise 80 units -- moderate
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/platform_cap.png"
        repeat_width: 140
      - type: physics_body
        body_type: static
        width: 140
        height: 20
  - name: platform_4
    components:
      - type: transform
        x: 1750
        y: 365 # feet rise 95 units -- right at the limit of a single jump
      - type: sprite
        image: "assets/SideviewSciFi/collection/Environments/sci-fi-environment-background-files/PNG/pieces/platform_cap.png"
        repeat_width: 150
      - type: physics_body
        body_type: static
        width: 150
        height: 20

  # Falling-sphere prototype: a game-rule hazard, cloned periodically by game_manager.py (the
  # "game_manager" entity's script, above) via engine.emit("SpawnEntity", ...) at a random X above
  # the level with a randomized fuse -- see MainMenu.spawnEntity (Go) for the generic clone +
  # physics-registration mechanism, and sphere_timer.py for each instance's own countdown/explode
  # behavior. Also exercises the object.Manager's dynamic create/destroy lifecycle (clone +
  # physics body creation on spawn, deactivation on explode) under a steady stream of short-lived
  # objects. "prototype: true" means this exact object is never itself run/drawn/
  # physics-initialized -- see object.GameObject.IsPrototype and PhysicsSystem.InitFromWorld's
  # prototype skip -- only cloned. seconds/x/y here are placeholders, overwritten on every clone.
  - name: sphere_prototype
    prototype: true
    components:
      - type: transform
      - type: ball
        radius: 15
        color_r: 0
        color_g: 0
        color_b: 0
      - type: physics_body
        body_type: dynamic
        shape: circle
        radius: 15
        density: 1
        restitution: 0.2
        friction: 0.3
      - type: timer
        seconds: 4
      - type: script
        path: "scripts/python/sphere_timer.py"

  # Explosion VFX prototype: spawned by sphere_timer.py (via engine.emit("SpawnEntity", ...), the
  # same generic mechanism game_manager.py uses to spawn spheres) at the exact moment a sphere's
  # fuse runs out, then self-destroys once its one-shot animation finishes (see
  # explosion_effect.py). Kept as its own GameObject rather than swapping the sphere's own visual
  # component, since object.Manager has no "hide this component but keep others" concept -- a
  # fresh entity with a single Drawer component (this spritesheet) sidesteps that entirely: no
  # Animator needed here since there is nothing else on this object competing to be drawn (see
  # object.Manager.Draw: with no Animator present, every Drawer component draws, and there is only
  # one). tint_r/g/b force the sheet's original fire-orange art to a black silhouette per art
  # direction; frames come from Explosion_Particle.png, a 9-frame 32x32-per-frame strip.
  - name: explosion_prototype
    prototype: true
    components:
      - type: transform
      - type: spritesheet
        image: "assets/vacaroxa--generic-run-n-gun-pack--v.1.0/Enemies/Explosion_Particle.png"
        frame_width: 32
        frame_height: 32
        cols: 10
        rows: 1
        fps: 16
        loop: false
      - type: timer
        seconds: 1
      - type: script
        path: "scripts/python/explosion_effect.py"
