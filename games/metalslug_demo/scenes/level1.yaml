# Level 1 — data-driven scene (objects + components), same pattern as
# games/demo1/scenes/main_menu.yaml. Placeholder Block/Ball shapes stand in for real sprites
# (see docs/game_concept_metal_slug_demo.md "Open questions" — art comes later, doesn't block mechanics).
#
# Level is 2400x540 game units (layout.level_width/level_height in config.yaml), 2.5x the 960x540
# viewport, so camera-follow (step 1) has room to scroll. Player run + shoot (step 3) is wired up;
# shooting spawns a projectile GameObject by cloning "projectile_prototype" below (Prototype
# pattern — see view/scene/mainmenu.go's spawnProjectile and object.GameObject.Clone). Projectile
# movement + off-level deactivation (step 4) is wired up too; enemies are still step 5.

objects:
  # Prototype (not a real object): "prototype: true" means this is never run or drawn (see
  # object.GameObject.IsPrototype) — it only exists to be cloned by spawnProjectile. Its transform
  # and projectile stats are overwritten on every clone; the values here are placeholders.
  - name: projectile_prototype
    prototype: true
    components:
      - type: transform
      - type: block
        width: 8
        height: 8
        color_r: 220
        color_g: 220
        color_b: 80
      - type: projectile
  - name: player
    components:
      - type: transform
        x: 100
        y: 380
      - type: block
        width: 50
        height: 80
        color_r: 90
        color_g: 140
        color_b: 90
      - type: physics_body
        body_type: kinematic
        width: 50
        height: 80
        mass: 10
      - type: intent_buffer
      - type: script
        path: "scripts/player_controller.lua"
  - name: ground
    components:
      - type: transform
        x: 0
        y: 460
      - type: block
        width: 2400
        height: 80
        color_r: 80
        color_g: 70
        color_b: 60
      - type: physics_body
        body_type: static
  - name: crate_1
    components:
      - type: transform
        x: 700
        y: 380
      - type: block
        width: 60
        height: 80
        color_r: 120
        color_g: 100
        color_b: 60
      - type: physics_body
        body_type: static
  - name: crate_2
    components:
      - type: transform
        x: 1400
        y: 400
      - type: block
        width: 80
        height: 60
        color_r: 120
        color_g: 100
        color_b: 60
      - type: physics_body
        body_type: static
  - name: crate_3
    components:
      - type: transform
        x: 2050
        y: 380
      - type: block
        width: 60
        height: 80
        color_r: 120
        color_g: 100
        color_b: 60
      - type: physics_body
        body_type: static
