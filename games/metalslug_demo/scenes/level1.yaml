# Level 1 scaffold — data-driven scene (objects + components), same pattern as
# games/demo1/scenes/main_menu.yaml. Placeholder Block/Ball shapes stand in for real sprites
# (see docs/game_concept_metal_slug_demo.md "Open questions" — art comes later, doesn't block mechanics).
#
# Level is 2400x540 game units (layout.level_width/level_height in config.yaml), 2.5x the 960x540
# viewport, so camera-follow (step 1) has room to scroll. No player movement, shooting, or enemies
# yet — those are steps 3-5 of the build plan; this scaffold only proves the level loads and the
# camera tracks a target across it.

objects:
  - name: player
    components:
      - type: transform
        x: 100
        y: 380
      - type: block
        width: 50
        height: 80
        color_r: 90
        color_g: 140
        color_b: 90
      - type: physics_body
        body_type: kinematic
        width: 50
        height: 80
        mass: 10
  - name: ground
    components:
      - type: transform
        x: 0
        y: 460
      - type: block
        width: 2400
        height: 80
        color_r: 80
        color_g: 70
        color_b: 60
      - type: physics_body
        body_type: static
