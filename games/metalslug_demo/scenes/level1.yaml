  # Prototype (not a real object): "prototype: true" means this is never run or drawn (see
  # object.GameObject.IsPrototype) — it only exists to be cloned by spawnProjectile. Its transform
  # and projectile stats are overwritten on every clone; the values here are placeholders.
  - name: projectile_prototype
    prototype: true
    components:
      - type: transform
      - type: block
        width: 8
        height: 8
        color_r: 220
        color_g: 220
        color_b: 80
      - type: projectile
  - name: player
    components:
      - type: transform
        x: 100
        y: 380
      - type: block
        width: 50
        height: 80
        color_r: 90
        color_g: 140
        color_b: 90
        facing_marker: true
      - type: physics_body
        body_type: dynamic
        width: 50
        height: 80
        friction: 0
        fixed_rotation: true
      - type: intent_buffer
      - type: script
        path: "scripts/python/player_controller.py"
  - name: enemy_1
